name: DLU CI

on:
  push:
  pull_request:

concurrency:
  group: dlu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          $files = @("main.py") + (Get-ChildItem dlu_app -Filter *.py -File | ForEach-Object { $_.FullName }) + (Get-ChildItem tests -Filter *.py -File | ForEach-Object { $_.FullName })
          python -m py_compile $files

      - name: UI static audit
        shell: pwsh
        run: python tools/ui_static_audit.py

      - name: Tests
        shell: pwsh
        run: python -m pytest -q tests --timeout=90 --timeout-method=thread
