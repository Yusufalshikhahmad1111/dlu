name: DLU Stage 14 Teaching Scenarios 2.0 QA

on:
  push:
    branches:
      - main
      - stage-14-teaching-scenarios-2
  pull_request:
    branches:
      - main

concurrency:
  group: stage14-scenarios-qa-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage14-scenarios-qa:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile check
        shell: pwsh
        run: python -m compileall dlu_app main.py

      - name: UI static audit
        shell: pwsh
        run: python tools/ui_static_audit.py

      - name: Stage 14 tests
        shell: pwsh
        run: python -m pytest -q tests/test_stage14_teaching_scenarios_2.py tests/test_teaching_scenarios.py

      - name: Full tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Functional visual QA
        shell: pwsh
        run: python tools/stage14_scenarios_qa.py

      - name: Upload Stage 14 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Stage14-Teaching-Scenarios-2-QA
          path: artifacts/stage14/*.png
          if-no-files-found: error
