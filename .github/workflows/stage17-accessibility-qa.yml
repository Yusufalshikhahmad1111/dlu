name: DLU Stage 17 Accessibility & Usability QA

on:
  push:
    branches:
      - main
      - stage-17-accessibility-usability
  pull_request:
    branches:
      - main

concurrency:
  group: stage17-accessibility-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage17-accessibility:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile check
        shell: pwsh
        run: python -m compileall dlu_app main.py
      - name: UI static audit
        shell: pwsh
        run: python tools/ui_static_audit.py
      - name: Stage 17 tests
        shell: pwsh
        run: python -m pytest -q tests/test_stage17_accessibility.py
      - name: Stage 16 compatibility tests
        shell: pwsh
        run: python -m pytest -q tests/test_stage16_instructor_classroom.py
      - name: Full regression
        shell: pwsh
        run: python -m pytest -q tests
      - name: Windows accessibility and resolution QA
        shell: pwsh
        run: python tools/stage17_accessibility_qa.py
      - name: Upload Stage 17 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Stage17-Accessibility-Usability-QA
          path: artifacts/stage17/*.png
          if-no-files-found: error
