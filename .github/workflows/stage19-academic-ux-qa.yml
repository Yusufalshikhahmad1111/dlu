name: DLU Stage 19 Final Academic UX Audit

on:
  push:
    branches:
      - main
      - stage-19-academic-ux-audit
  pull_request:
    branches:
      - main

concurrency:
  group: stage19-academic-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage19-academic-ux:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile check
        shell: pwsh
        run: python -m compileall dlu_app main.py
      - name: UI static audit
        shell: pwsh
        run: python tools/ui_static_audit.py
      - name: Stage 19 focused audit
        shell: pwsh
        run: python -m pytest -q tests/test_stage19_academic_ux.py
      - name: Stage 17 accessibility compatibility
        shell: pwsh
        run: python -m pytest -q tests/test_stage17_accessibility.py
      - name: Stage 18 architecture compatibility
        shell: pwsh
        run: python -m pytest -q tests/test_stage18_architecture.py
      - name: Full regression
        shell: pwsh
        run: python -m pytest -q tests
      - name: Windows academic UX QA
        shell: pwsh
        run: python tools/stage19_academic_ux_qa.py
      - name: Upload Stage 19 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Stage19-Academic-UX-QA
          path: artifacts/stage19/*.png
          if-no-files-found: error
