name: DLU Stage 20 — Actions cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[actions-cleanup]')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Cancel stale workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/$REPO/actions/runs"
          runs="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$api?per_page=100")"

          echo "$runs" | jq -r '.workflow_runs[]
            | select((.status == "queued") or (.status == "in_progress") or (.status == "pending"))
            | [.id, .name, .event, .head_branch, .head_sha]
            | @tsv' |
          while IFS=$'\t' read -r run_id name event branch sha; do
            [ "$run_id" = "$CURRENT_RUN" ] && continue

            if [ "$name" = "DLU Stage 20 — DLU Lab 2.0 Release" ] &&
               [ "$event" = "push" ] &&
               [ "$branch" = "main" ] &&
               [ "$sha" = "$CURRENT_SHA" ]; then
              echo "Keeping current Stage 20 release run: $run_id"
              continue
            fi

            echo "Cancelling stale run: $run_id | $name | $event | $branch | $sha"
            curl -fsS -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "$api/$run_id/cancel" >/dev/null || true
          done

          echo "Stale workflow cleanup requested."
