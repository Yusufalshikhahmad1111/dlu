name: DLU Stage 20 — DLU Lab 2.0 Release

on:
  push:
    branches:
      - main
      - stage-20-dlu-lab-2-release
      - stage-20-final-release
    tags:
      - "v2.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage20-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile check
        shell: bash
        run: python -m compileall dlu_app main.py tests

      - name: UI static audit
        shell: bash
        run: python tools/ui_static_audit.py

      - name: Stage 20 focused release checks
        shell: bash
        run: python -m pytest -q tests/test_stage20_release.py --timeout=90 --timeout-method=thread

      - name: Stage 17 accessibility compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage17_accessibility.py --timeout=90 --timeout-method=thread

      - name: Stage 18 architecture compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage18_architecture.py --timeout=90 --timeout-method=thread

      - name: Stage 19 academic compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage19_academic_ux.py --timeout=90 --timeout-method=thread


  windows-regression:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            tests: >-
              tests/test_call_engine.py
              tests/test_command_files.py
              tests/test_communications_lab.py
              tests/test_mml.py
              tests/test_release_features.py
              tests/test_teaching_scenarios.py
          - name: ui-hardening
            tests: tests/test_ui_hardening.py
          - name: hardware
            tests: tests/test_hardware_stage2.py
          - name: stage8-ui
            tests: tests/test_stage8_ui.py
          - name: stage9-navigation
            tests: tests/test_stage9_navigation.py
          - name: stage10-hardware
            tests: tests/test_stage10_hardware_ux.py
          - name: stage11-omt
            tests: tests/test_stage11_omt_ux.py
          - name: stage12-call-visualization
            tests: tests/test_stage12_call_visualization.py
          - name: learning
            tests: >-
              tests/test_communications_ui.py
              tests/test_stage13_communications_lab_2.py
              tests/test_stage14_teaching_scenarios_2.py
              tests/test_stage15_academic_learning_layer.py
          - name: accessibility
            tests: >-
              tests/test_stage16_instructor_classroom.py
              tests/test_stage17_accessibility.py
              tests/test_stage18_architecture.py
              tests/test_stage19_academic_ux.py
              tests/test_stage20_release.py
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regression shard ${{ matrix.name }}
        shell: pwsh
        run: python -m pytest -q ${{ matrix.tests }} --timeout=90 --timeout-method=thread

  windows-release:
    needs: windows-regression
    runs-on: windows-2022
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Windows Stage 20 visual QA
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/stage20_release_qa.py

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: .\\tools\\build_windows.ps1

      - name: Verify packaged version
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "No packaged executable found." }
          $exeDir = Split-Path -Parent $exe.FullName
          $trigger = Join-Path $exeDir "dlu-release-probe.trigger"
          $result = Join-Path $exeDir "dlu-release-probe.result"
          if (Test-Path $trigger) { Remove-Item $trigger -Force }
          if (Test-Path $result) { Remove-Item $result -Force }
          New-Item -ItemType File -Path $trigger | Out-Null
          & $exe.FullName
          if (-not (Test-Path $result)) {
            throw "Packaged release probe did not produce dlu-release-probe.result."
          }
          $version = (Get-Content -Raw -Path $result).Trim()
          Write-Host "Packaged version: $version"
          if ($version -ne "DLU Lab 2.0.0") {
            throw "Unexpected packaged version: $version"
          }
          Remove-Item $trigger,$result -Force

      - name: Upload DLU Lab 2.0 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload DLU Lab 2.0 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Screenshots
          path: artifacts/stage20/*.png
          if-no-files-found: error

      - name: Upload build screenshots for continuity
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Build-Screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
