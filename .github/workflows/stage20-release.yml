name: DLU Stage 20 — DLU Lab 2.0 Release

on:
  push:
    branches:
      - main
      - stage-20-dlu-lab-2-release
      - stage-20-final-release
    tags:
      - "v2.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stage20-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Qt runtime libraries
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile check
        shell: bash
        run: python -m compileall dlu_app main.py tests

      - name: UI static audit
        shell: bash
        run: python tools/ui_static_audit.py

      - name: Stage 20 focused release checks
        shell: bash
        run: python -m pytest -q tests/test_stage20_release.py --timeout=90 --timeout-method=thread

      - name: Stage 17 accessibility compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage17_accessibility.py --timeout=90 --timeout-method=thread

      - name: Stage 18 architecture compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage18_architecture.py --timeout=90 --timeout-method=thread

      - name: Stage 19 academic compatibility
        shell: bash
        run: python -m pytest -q tests/test_stage19_academic_ux.py --timeout=90 --timeout-method=thread

      - name: Full regression
        shell: bash
        run: python -m pytest -q tests --timeout=90 --timeout-method=thread

  windows-release:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Windows Stage 20 visual QA
        shell: pwsh
        run: python tools/stage20_release_qa.py

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: .\tools\build_windows.ps1

      - name: Verify packaged version
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "No packaged executable found." }
          $versionFile = Join-Path $env:RUNNER_TEMP "dlu-version.txt"
          if (Test-Path $versionFile) { Remove-Item $versionFile -Force }
          $env:DLU_RELEASE_PROBE = "1"
          $env:DLU_VERSION_FILE = $versionFile
          & $exe.FullName
          $probeExit = $LASTEXITCODE
          if (-not (Test-Path $versionFile)) {
            throw "Packaged GUI-safe version probe failed (exit code $probeExit) and produced no version file."
          }
          $version = (Get-Content -Raw -Path $versionFile).Trim()
          Write-Host "Packaged GUI-safe version probe exit code: $probeExit"
          Write-Host "Packaged version file: $version"
          if ($version -ne "DLU Lab 2.0.0") {
            throw "Unexpected packaged version: $version"
          }

      - name: Upload DLU Lab 2.0 Windows package
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload DLU Lab 2.0 screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Screenshots
          path: artifacts/stage20/*.png
          if-no-files-found: error

      - name: Upload build screenshots for continuity
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-2.0.0-Build-Screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
