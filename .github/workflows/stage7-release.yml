name: DLU Stage 7 Release Build

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "dlu_app/**"
      - "data/**"
      - "tools/build_windows.ps1"
      - "tools/capture_screenshots.py"
      - ".github/workflows/stage7-release.yml"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: .\tools\build_windows.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload final UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Lab-Screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
