name: DLU Stage 8 v2 UX QA

on:
  workflow_dispatch:

jobs:
  ux-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Python compile
        shell: pwsh
        run: |
          $files = @("main.py") + (Get-ChildItem dlu_app -Filter *.py -File | ForEach-Object { $_.FullName }) + (Get-ChildItem tests -Filter *.py -File | ForEach-Object { $_.FullName })
          python -m py_compile $files

      - name: UI static audit
        shell: pwsh
        run: python tools/ui_static_audit.py

      - name: Full tests
        shell: pwsh
        run: python -m pytest -q tests

      - name: Stage 8 v2 functional and visual QA
        shell: pwsh
        run: python tools/stage8_v2_qa.py

      - name: Upload Stage 8 v2 QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DLU-Stage8-v2-QA
          path: artifacts/stage8-v2/*.png
          if-no-files-found: error
